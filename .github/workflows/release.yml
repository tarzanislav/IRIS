name: Release

# A release of IRIS: the core library, the command line and the application for Windows and the int8 language packs
# (en→sk, en→cs, sk→en, cs→en) with their catalog packs.json, the signed programs of the classroom learning (server,
# computers, console), licences and SHA-256 sums. Started by hand (Actions → Release → Run workflow) and run only after the owner approves it in the
# environment "release". Only a commit of main whose CI passed every gate (F1 reference, F2 quality and speed) is released.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (must be the <Version> in Directory.Build.props and have docs/releases/vVERSION.md)'
        required: true
      ocr_run:
        description: 'Run ID of "OCR learning" whose model goes into the release (empty = no OCR model)'
        default: 

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      PAIRS: en-sk en-cs sk-en cs-en
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checks – main, version, notes, gates of this commit
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::only main is released"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version $VERSION is not X.Y.Z"; exit 1; }
          grep -q "<Version>$VERSION</Version>" Directory.Build.props || { echo "::error::Directory.Build.props does not have version $VERSION"; exit 1; }
          [ -f "docs/releases/v$VERSION.md" ] || { echo "::error::docs/releases/v$VERSION.md is missing"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "::error::release v$VERSION exists"; exit 1; fi
          checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.conclusion != "skipped") | "\(.name)=\(.conclusion)"')
          echo "$checks"
          for gate in "Build and tests (Linux)" "Reference (transformers)" "Quality and speed (F2)" \
            "Windows (build, tests, publish, hardware script)" "Language pair en-cs" "Language pair sk-en" "Language pair cs-en" \
            "Learning (F3)"; do
            echo "$checks" | grep -qx "$gate=success" || { echo "::error::CI gate '$gate' has not passed on $GITHUB_SHA"; exit 1; }
          done
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build and tests
        run: |
          dotnet build Iris.slnx -c Release
          dotnet run --project tests/Iris.Tests -c Release --no-build
      - name: Library and command line for Windows
        run: |
          mkdir -p out/assets out/cli
          cp src/Iris.Core/bin/Release/net10.0/Iris.Core.dll out/assets/
          dotnet publish src/Iris.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/cli
          cp LICENSE out/cli/
          (cd out/cli && zip -q -r "../assets/iris-$VERSION-win-x64.zip" .)
      - name: Language packs – download (licence checked), convert, int8, catalog
        run: |
          iris="dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll"
          : > /tmp/model-info.txt
          for pair in $PAIRS; do
            bash tools/reference/prepare-opus.sh /tmp "$pair"
            file="out/assets/opus-mt-$pair-int8.iris"
            $iris quantize "/tmp/opus-$pair.iris" "$file"
            $iris info "$file" | sed "s/^/$pair /" | tee -a /tmp/model-info.txt
            rm -rf "/tmp/opus-$pair" "/tmp/opus-$pair.iris"
            case "$pair" in en-*) text="The premiere is tonight." ;; *) text="Premiéra je dnes večer." ;; esac
            sample=$($iris translate "$file" "$text")
            echo "$pair: $text → $sample"
            [[ "${sample,,}" == *premi* ]] || { echo "::error::the $pair model does not translate as expected: $sample"; exit 1; }
          done
          bash tools/ci/packs.sh out/assets $PAIRS | tee out/assets/packs.json
      - name: OCR model (from the OCR learning run), checked against its PyTorch reference
        if: inputs.ocr_run != ''
        run: |
          gh run download "${{ inputs.ocr_run }}" -n ocr-model -D /tmp/ocr-model
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll check-ocr /tmp/ocr-model/iris-ocr.iris /tmp/ocr-model/reference
          cp /tmp/ocr-model/iris-ocr.iris out/assets/iris-ocr.iris
          # the same model as a learning file: the classroom server starts from it (install.sh --start)
          /tmp/venv/bin/pip install -q -r tools/ocr/requirements.txt
          /tmp/venv/bin/python tools/ocr/to_training_file.py /tmp/ocr-model/checkpoint.pt out/assets/iris-ocr-train.iris
          # the fonts of the learning run (ocr.yml), so the check reads the lines the model learned on
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation2 \
            fonts-noto-core fonts-texgyre fonts-crosextra-carlito fonts-crosextra-caladea fonts-linuxlibertine >/dev/null
          mkdir -p /tmp/ocr-check
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll train-ocr /tmp/ocr-check --start out/assets/iris-ocr-train.iris \
            --minutes 0.2 --test-lines 300 --test-every 0.1 --fonts /usr/share/fonts --threads 4 | tee /tmp/ocr-check.txt | tail -3
          # a broken file reads nothing (CER near 100 %); the C# drawing differs a little from the learning run's
          first=$(grep -m1 -o 'CER [0-9.]* %' /tmp/ocr-check.txt | grep -o '[0-9.]*')
          awk -v c="$first" 'BEGIN { exit !(c < 10) }' || { echo "::error::the learning file does not read like the model (CER $first %)"; exit 1; }
          echo "::notice title=OCR learning file::iris-ocr-train.iris reads with CER $first % before any further learning"
          cer=$(python3 -c "import json; r = json.load(open('/tmp/ocr-model/result.json')); print(f'CER {r[\"cer_known\"]} % / {r[\"cer_unseen\"]} % (unseen font), step {r[\"step\"]}')")
          source="IRIS OCR, learning run ${{ inputs.ocr_run }}, $cer"
          echo "OCR_SOURCE=$source" >> "$GITHUB_ENV"
          echo "::notice title=OCR model::$cer"
          OCR_FILE=iris-ocr.iris OCR_SOURCE="$source" bash tools/ci/packs.sh out/assets $PAIRS | tee out/assets/packs.json
      - name: Application for Windows (with the catalog of this release)
        run: |
          cp out/assets/packs.json src/Iris.App/packs.json
          dotnet publish src/Iris.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/app
          rm src/Iris.App/packs.json
          cp LICENSE out/app/
          (cd out/app && zip -q "../assets/iris-app-$VERSION-win-x64.zip" iris-app.exe LICENSE)
      # the programs of the classroom learning, with a manifest signed by the key of the releases (a secret of this
      # workflow); the server installs them only with this signature and gives them to the computers and the console
      - name: Classroom programs, signed (when the key of the releases is set up)
        env:
          IRIS_UPDATE_KEY: ${{ secrets.IRIS_UPDATE_KEY }}
        run: |
          if [ -z "$IRIS_UPDATE_KEY" ] || [ ! -f tools/lab/update-key.pub ]; then
            echo "::warning title=Classroom programs::not in this release – the key of the releases is not set up (the secret IRIS_UPDATE_KEY and tools/lab/update-key.pub)"
            exit 0
          fi
          set -e
          mkdir -p out/lab out/server
          for arch in x64 arm64; do
            dotnet publish src/Iris.Hub -c Release -r "linux-$arch" --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o "out/hub-$arch"
            cp "out/hub-$arch/iris-hub" "out/lab/iris-hub-linux-$arch"
          done
          dotnet publish src/Iris.Agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/agent
          cp out/agent/iris-agent.exe out/lab/iris-agent-win-x64.exe
          dotnet publish src/Iris.LabConsole -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/console
          cp out/console/iris-console.exe out/lab/iris-console-win-x64.exe
          # the learning file of the OCR model is signed too: the console can ask the server to start the classroom from it
          if [ -f out/assets/iris-ocr-train.iris ]; then cp out/assets/iris-ocr-train.iris out/lab/; fi
          python3 - "$VERSION" out/lab > "$RUNNER_TEMP/iris-lab-manifest.json" <<'PY'
          import hashlib, json, os, sys
          version, folder = sys.argv[1], sys.argv[2]
          files = []
          for name in sorted(os.listdir(folder)):
              data = open(os.path.join(folder, name), 'rb').read()
              files.append({'name': name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          print(json.dumps({'version': version, 'files': files}, indent=1))
          PY
          mv "$RUNNER_TEMP/iris-lab-manifest.json" out/lab/iris-lab-manifest.json
          umask 077
          printf '%s\n' "$IRIS_UPDATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-key.pem" -out out/lab/iris-lab-manifest.sig out/lab/iris-lab-manifest.json
          rm -f "$RUNNER_TEMP/update-key.pem"
          umask 022
          openssl dgst -sha256 -verify tools/lab/update-key.pub -signature out/lab/iris-lab-manifest.sig out/lab/iris-lab-manifest.json
          cat out/lab/iris-lab-manifest.json
          # the server in one archive: both builds, install and removal, the units, the guide
          cp out/lab/iris-hub-linux-* tools/lab/install.sh tools/lab/uninstall.sh tools/lab/iris-hub.service tools/lab/iris-hub-update.* docs/ucebna.md out/server/
          tar -czf "out/assets/iris-hub-$VERSION-linux.tar.gz" -C out/server .
          cp out/lab/* out/assets/
      - name: Licences, provenance, checksums
        run: |
          cp LICENSE out/assets/LICENSE
          {
            echo "IRIS $VERSION"
            echo
            echo "Code: IRIS (Iris.Core.dll, iris.exe, iris-app.exe) – Apache-2.0, see LICENSE. Built from commit $GITHUB_SHA."
            echo "The command line and the application for Windows also contain the .NET runtime and WPF (MIT, Microsoft)."
            echo
            echo "Language packs: opus-mt-<pair>-int8.iris – weights of Helsinki-NLP/opus-mt-<pair> (OPUS-MT, Language"
            echo "Technology Research Group at the University of Helsinki), licence Apache-2.0, converted to the IRIS format and"
            echo "quantized to int8 (one scale per row) by tools/reference/marian_reference.py and iris quantize."
            for pair in $PAIRS; do
              variable=$(echo "OPUS_MT_${pair}_REVISION" | tr 'a-z-' 'A-Z_')
              echo "  $pair: https://huggingface.co/Helsinki-NLP/opus-mt-$pair revision ${!variable}"
            done
            echo "Provenance inside the files:"
            grep ' provenance:' /tmp/model-info.txt
            if [ -f out/assets/iris-ocr.iris ]; then
              echo
              echo "OCR model: iris-ocr.iris – own IRIS line reader (tools/ocr), learned on generated lines (invented texts and"
              echo "their translations by the models above, drawn with free fonts: DejaVu, Liberation, Noto, TeX Gyre, Carlito,"
              echo "Linux Libertine) – no text or picture of anyone. ${OCR_SOURCE:-}"
            fi
          } > out/assets/NOTICE.txt
          (cd out/assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        run: |
          gh release create "v$VERSION" out/assets/* --target "$GITHUB_SHA" --title "IRIS $VERSION" --notes-file "docs/releases/v$VERSION.md"
          { echo "### IRIS $VERSION"; echo; echo '```'; cat out/assets/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
