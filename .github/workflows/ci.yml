name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  core:
    name: Build and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the runner image's .NET 10 SDK, else the Ubuntu package
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: bash tools/ci/dotnet.sh build Iris.slnx -c Release
      - name: Code format (.editorconfig)
        run: bash tools/ci/dotnet.sh format Iris.slnx --verify-no-changes
      - name: Tests
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      # the same tests on the paths of older processors: AVX without AVX2 and FMA (Sandy and Ivy Bridge), 128-bit
      # vectors only (SSE – Pentium and Celeron, like NEON on ARM), then no vector instructions at all
      - name: Tests without AVX2
        env:
          DOTNET_EnableAVX2: '0'
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      - name: Tests with SSE only
        env:
          DOTNET_EnableAVX: '0'
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      - name: Tests without vector instructions
        env:
          DOTNET_EnableHWIntrinsic: '0'
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      - name: Command line smoke test
        run: dotnet run --project src/Iris.Cli -c Release --no-build -- tokenize tests/Iris.Tests/testdata/tokenizer/nfkc.model "The premiere is tonight."

  # The own core against the reference implementation (Hugging Face transformers + PyTorch, CPU). Python runs only
  # here; IRIS itself has no Python. Heavy, so not on every push of a branch – on pull requests, main and by hand.
  reference:
    name: Reference (transformers)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: Python tools of the reference
        run: bash tools/reference/prepare-opus.sh
      - name: Tiny random model – must match exactly
        run: |
          py=/tmp/venv/bin/python
          $py tools/reference/marian_reference.py tiny /tmp/tiny
          $py tools/reference/marian_reference.py convert /tmp/tiny /tmp/tiny.iris
          $py tools/reference/marian_reference.py reference /tmp/tiny /tmp/tiny.json --set tiny
          bash tools/reference/verify.sh /tmp/tiny.iris /tmp/tiny.json --min-greedy 1 --min-beam 1
      - name: OPUS-MT en-sk – download (licence checked) and convert
        run: |
          bash tools/reference/prepare-opus.sh /tmp
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll info /tmp/opus-en-sk.iris
      - name: OPUS-MT en-sk – reference of 500 invented sentences
        run: /tmp/venv/bin/python tools/reference/marian_reference.py reference /tmp/opus-en-sk /tmp/opus-en-sk.json --set opus --count 500
      - name: OPUS-MT en-sk – gate F1 (greedy ≥ 99 %, beam ≥ 95 %)
        run: bash tools/reference/verify.sh /tmp/opus-en-sk.iris /tmp/opus-en-sk.json --min-greedy 0.99 --min-beam 0.95
      - name: First translations of the own core
        if: always()
        run: |
          [ -f /tmp/opus-en-sk.iris ] || exit 0
          printf '%s\n' "The premiere is tonight." "Critics praised the music but found the ending too slow." \
            "Where is the nearest cinema?" "The second season will have eight episodes." > /tmp/samples.en
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll translate /tmp/opus-en-sk.iris < /tmp/samples.en > /tmp/samples.sk
          paste -d '\t' /tmp/samples.en /tmp/samples.sk | while IFS=$'\t' read -r en sk; do echo "::notice title=EN→SK (IRIS)::$en → $sk"; done

  # Windows, where IRIS runs: build, tests, the command line as published for a release, the hardware script
  windows:
    name: Windows (build, tests, publish, hardware script)
    runs-on: windows-2025
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if (-not (dotnet --list-sdks 2>$null | Select-String '^10\.')) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $env:RUNNER_TEMP/dotnet-install.ps1
            & $env:RUNNER_TEMP/dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:ProgramFiles/dotnet"
          }
          dotnet --list-sdks
      - name: Build and tests
        run: |
          dotnet build Iris.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Iris.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Command line as in a release (self-contained, one file)
        run: |
          dotnet publish src/Iris.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/cli
          $size = [math]::Round((Get-Item out/cli/iris.exe).Length / 1MB, 1)
          ./out/cli/iris.exe tokenize tests/Iris.Tests/testdata/tokenizer/nfkc.model "The premiere is tonight."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "::notice title=iris.exe::self-contained single file, $size MB"
      - name: Classroom agent as in a release (one file) – a trial, and the service installed, running and removed
        run: |
          dotnet publish src/Iris.Agent -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./out/agent/iris-agent.exe test --minutes 1 | Tee-Object -FilePath "$env:RUNNER_TEMP/agent-test.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [byte[]]::new(32); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          Set-Content "$env:RUNNER_TEMP/agent.key" ([Convert]::ToBase64String($bytes))
          ./out/agent/iris-agent.exe install --hub 127.0.0.1 --key "$env:RUNNER_TEMP/agent.key" --name ci-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 10
          $service = Get-Service IRIS-Lab
          $acl = icacls "$env:ProgramData\IRIS Lab" | Out-String
          $log = Get-Content "$env:ProgramData\IRIS Lab\agent.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          ./out/agent/iris-agent.exe uninstall
          if ($service.Status -ne 'Running') { "::error::the service IRIS-Lab is $($service.Status)"; exit 1 }
          if ($acl -match 'BUILTIN\\Users|Everyone|Authenticated') { "::error::students could read the key: $acl"; exit 1 }
          if (Get-Service IRIS-Lab -ErrorAction SilentlyContinue) { "::error::the service was not removed"; exit 1 }
          # the uninstall the console asks for: started while the service runs, it removes it all in the background
          ./out/agent/iris-agent.exe install --hub 127.0.0.1 --key "$env:RUNNER_TEMP/agent.key" --name ci-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 5
          & "$env:ProgramFiles\IRIS Lab\iris-agent.exe" uninstall --later
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gone = $false
          for ($i = 0; $i -lt 30 -and -not $gone; $i++) {
            Start-Sleep -Seconds 5
            $gone = -not (Get-Service IRIS-Lab -ErrorAction SilentlyContinue) -and -not (Test-Path "$env:ProgramFiles\IRIS Lab") -and -not (Test-Path "$env:ProgramData\IRIS Lab")
          }
          if (-not $gone) { "::error::the uninstall in the background left something: service $((Get-Service IRIS-Lab -ErrorAction SilentlyContinue).Status), program $(Test-Path "$env:ProgramFiles\IRIS Lab"), data $(Test-Path "$env:ProgramData\IRIS Lab")"; exit 1 }
          $summary = (Get-Content "$env:RUNNER_TEMP/agent-test.txt" | Select-Object -Last 1)
          "::notice title=iris-agent.exe::$summary; service ran ($log), key readable only by SYSTEM and Administrators, removed cleanly, also in the background as the console asks"
      - name: Application as in a release (self-contained, one file) and its self-test
        run: |
          dotnet publish src/Iris.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:IRIS_HOME = Join-Path $env:RUNNER_TEMP 'iris-home'
          $test = Start-Process out/app/iris-app.exe -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP/selftest.txt"
          if ($test.ExitCode -ne 0) {
            $text = (Get-Content "$env:RUNNER_TEMP/selftest.txt" -Raw) -replace '%', '%25' -replace "`r?`n", '%0A'
            "::error title=iris-app --selftest::$text"; exit 1
          }
          $size = [math]::Round((Get-Item out/app/iris-app.exe).Length / 1MB, 1)
          "::notice title=iris-app.exe::self-contained single file, $size MB, every window and page built in SK, CS, EN and every look"
      - name: Classroom console (one file) and its self-test with a picture of every page
        run: |
          dotnet publish src/Iris.LabConsole -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process out/console/iris-console.exe -ArgumentList '--selftest', "$env:RUNNER_TEMP\console" -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP/console.txt"
          if ($test.ExitCode -ne 0) {
            $text = (Get-Content "$env:RUNNER_TEMP/console.txt" -Raw) -replace '%', '%25' -replace "`r?`n", '%0A'
            "::error title=iris-console --selftest::$text"; exit 1
          }
          $size = [math]::Round((Get-Item out/console/iris-console.exe).Length / 1MB, 1)
          $pages = (Get-ChildItem "$env:RUNNER_TEMP\console" -Filter *.png).Count
          "::notice title=iris-console.exe::self-contained single file, $size MB, $pages pages built and pictured"
          # the pictures also into the log (base64 between markers), where they can be read without the artifact storage
          foreach ($png in Get-ChildItem "$env:RUNNER_TEMP\console" -Filter *.png) {
            "IRIS-PICTURE-BEGIN $($png.Name)"; [Convert]::ToBase64String([IO.File]::ReadAllBytes($png.FullName)); "IRIS-PICTURE-END"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: console-pictures
          path: ${{ runner.temp }}/console/
          retention-days: 14
      # the programs of the classroom learning to try out (Actions → this run → Artifacts); a release comes only with
      # the owner's consent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iris-ucebna-windows
          path: |
            out/agent/iris-agent.exe
            out/console/iris-console.exe
            docs/ucebna.md
          retention-days: 30
      - name: Hardware script (iris-hw.bat)
        run: |
          cmd /c tools\hardware\iris-hw.bat ci-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('ci-runner')) {
            $report = Get-Content "tools/hardware/iris-hw-$name.txt" -Raw | ConvertFrom-Json
            if (-not $report.cpu.name -or -not $report.memory.total_gb -or -not $report.memory.read_gbs_all_threads -or
                $null -eq $report.cpu.features.Fma) {
              "::error::hardware report $name is incomplete"; exit 1
            }
            $text = (Get-Content "tools/hardware/iris-hw-$name.txt" -Raw) -replace '%', '%25' -replace "`r?`n", '%0A'
            "::notice title=hardware $name::$text"
          }

  # Further language pairs (EN→CS, SK→EN, CS→EN) checked as language packs: licence, reference, int8 quality on FLORES
  pairs:
    name: Language pair ${{ matrix.pair }}
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [en-cs, sk-en, cs-en]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: Python tools of the reference
        run: bash tools/reference/prepare-opus.sh
      - name: ${{ matrix.pair }} – download, reference, int8, FLORES-200
        run: bash tools/reference/pair.sh ${{ matrix.pair }}

  # F2: int8, speed (no slower than the base commit; target title + introduction ≤ 1 s) and quality (chrF on FLORES-200 devtest, int8 not worse than float32)
  quality:
    name: Quality and speed (F2)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: OPUS-MT en-sk – Python tools (only for converting), download (licence checked) and convert
        run: bash tools/reference/prepare-opus.sh /tmp
      # the speed gate compares with the base commit on the same runner (the pull request's base, or main before the push)
      - name: Base commit for the speed comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then echo "no base commit"; exit 0; fi
          git fetch -q --depth 1 origin "$BASE_SHA"
          git worktree add -q /tmp/base FETCH_HEAD
          dotnet build /tmp/base/src/Iris.Cli -c Release > /dev/null
          echo "BASELINE_IRIS=dotnet /tmp/base/src/Iris.Cli/bin/Release/net10.0/iris.dll" >> "$GITHUB_ENV"
      - name: int8, speed and FLORES-200 quality – gates F2
        run: bash tools/reference/quality.sh /tmp/opus-en-sk.iris

  # the server of the classroom on Linux as the owner installs it: both builds, install.sh on a system with systemd,
  # the hub running as its own user with its keys, the updater, a second install over the first, and removal
  lab-linux:
    name: Classroom server on Linux (install, update, removal)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: The hub for x64 and arm64 (self-contained, one file), with its scripts
        run: |
          set -e
          mkdir -p out/hub
          for arch in x64 arm64; do
            dotnet publish src/Iris.Hub -c Release -r "linux-$arch" --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o "out/hub-$arch"
            cp "out/hub-$arch/iris-hub" "out/hub/iris-hub-linux-$arch"
          done
          cp tools/lab/install.sh tools/lab/uninstall.sh tools/lab/iris-hub.service tools/lab/iris-hub-update.service \
            tools/lab/iris-hub-update.timer tools/lab/iris-hub-update.path docs/ucebna.md out/hub/
          ls -la out/hub
          echo "::notice title=iris-hub::x64 $(du -m out/hub/iris-hub-linux-x64 | cut -f1) MB, arm64 $(du -m out/hub/iris-hub-linux-arm64 | cut -f1) MB"
      - name: Install, the hub runs as its own user, keys only for it, the backup folder untouched otherwise
        run: |
          set -e
          sudo mkdir -p /srv/share/IRIS && echo "a file of the owner" | sudo tee /srv/share/IRIS/note.txt >/dev/null
          sudo bash out/hub/install.sh --backup /srv/share/IRIS --options "--round 10"
          systemctl is-active iris-hub iris-hub-update.timer iris-hub-update.path
          [ "$(ps -o user= -C iris-hub | head -1)" = "iris-hub" ] || { echo "::error::the hub does not run as iris-hub"; exit 1; }
          for i in $(seq 1 20); do ss -ltn | grep -q ':47620 ' && break; sleep 1; done
          ss -ltn | grep -q ':47620 ' || { echo "::error::the hub does not listen on 47620"; journalctl -u iris-hub --no-pager | tail -40; exit 1; }
          [ "$(sudo stat -c '%U %a' /var/lib/iris-hub/agent.key)" = "iris-hub 600" ] || { echo "::error::agent.key is not only the hub's"; exit 1; }
          sudo /opt/iris-hub/iris-hub console-key add notebook-a --out /srv/share/IRIS
          [ "$(sudo stat -c '%U %a' /var/lib/iris-hub/consoles/notebook-a.key)" = "iris-hub 600" ] || { echo "::error::a console key made by root is not the hub's"; exit 1; }
          sudo runuser -u iris-hub -- test -r /var/lib/iris-hub/consoles/notebook-a.key || { echo "::error::the hub cannot read the console key"; exit 1; }
          sudo test -f /srv/share/IRIS/notebook-a.key || { echo "::error::no copy of the console key"; exit 1; }
          sudo /opt/iris-hub/iris-hub console-key list | grep -qx notebook-a || { echo "::error::the console key is not listed"; exit 1; }
          sudo /opt/iris-hub/iris-hub console-key remove notebook-a
          ! sudo test -e /var/lib/iris-hub/consoles/notebook-a.key || { echo "::error::the console key was not removed"; exit 1; }
          [ "$(sudo stat -c '%a' /var/lib/iris-hub)" = "750" ] || { echo "::error::the data folder is open to others"; exit 1; }
          sudo runuser -u iris-hub -- test -w /srv/share/IRIS || { echo "::error::the hub cannot write the backup"; exit 1; }
          [ "$(cat /srv/share/IRIS/note.txt)" = "a file of the owner" ] || { echo "::error::the backup folder was changed"; exit 1; }
          grep -q -- '--backup /srv/share/IRIS --round 10' /etc/default/iris-hub || { echo "::error::the options were not written"; exit 1; }
      - name: The updater (as systemd runs it), a second install over the first keeps the data
        run: |
          set -e
          sudo /opt/iris-hub/iris-hub version
          # the updater asks GitHub for the newest release (built with the key of the releases); a shared runner may be
          # refused by GitHub's limit for clients without a sign-in – then only that is allowed to fail
          if ! sudo systemctl start iris-hub-update.service; then
            journalctl -u iris-hub-update --no-pager | tail -20
            if journalctl -u iris-hub-update --no-pager | grep -qE 'iris-hub: .*(403|429|rate limit|Forbidden|Too Many)'; then
              echo "::warning title=Updater::GitHub refused this runner (limit for clients without a sign-in) – the updater itself ran"
            else
              echo "::error::the updater failed"; exit 1
            fi
          fi
          journalctl -u iris-hub-update --no-pager | tail -5
          key=$(sudo sha256sum /var/lib/iris-hub/agent.key)
          sudo bash out/hub/install.sh
          [ "$(sudo sha256sum /var/lib/iris-hub/agent.key)" = "$key" ] || { echo "::error::a second install changed the keys"; exit 1; }
          grep -q -- '--backup /srv/share/IRIS' /etc/default/iris-hub || { echo "::error::a second install lost the options"; exit 1; }
          systemctl is-active iris-hub
      - name: An older hub updates itself to the newest release and the hub runs the new program afterwards
        run: |
          set -e
          # this commit's hub built as 0.0.1, so the newest release is newer: it replaces itself and restarts the hub
          # (0.4.1 replaced the program but could not restart – the bundle was read by its path after the replacement)
          dotnet publish src/Iris.Hub -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=0.0.1 -o out/hub-old
          sudo systemctl stop iris-hub
          sudo install -m 0755 out/hub-old/iris-hub /opt/iris-hub/iris-hub
          sudo systemctl start iris-hub
          [ "$(sudo /opt/iris-hub/iris-hub version)" = "iris-hub 0.0.1" ] || { echo "::error::the old hub is not in place"; exit 1; }
          if ! sudo systemctl start iris-hub-update.service; then
            journalctl -u iris-hub-update --no-pager | tail -20
            if journalctl -u iris-hub-update --no-pager | grep -qE 'iris-hub: .*(403|429|rate limit|Forbidden|Too Many)'; then
              echo "::warning title=Updater::GitHub refused this runner – the update from an older hub was not tried"; exit 0
            fi
            echo "::error::the update from an older hub failed"; exit 1
          fi
          journalctl -u iris-hub-update --no-pager | tail -5
          new=$(sudo /opt/iris-hub/iris-hub version)
          [ "$new" != "iris-hub 0.0.1" ] || { echo "::error::the program was not replaced"; exit 1; }
          for i in $(seq 1 20); do systemctl is-active -q iris-hub && break; sleep 1; done
          systemctl is-active iris-hub
          pid=$(systemctl show -p MainPID --value iris-hub)
          exe=$(sudo readlink "/proc/$pid/exe")
          case "$exe" in *deleted*) echo "::error::the hub still runs the old program ($exe)"; exit 1;; esac
          echo "::notice title=Update from an older hub::0.0.1 → ${new#iris-hub }, the hub restarted with the new program"
      - name: Removal – everything of the hub gone, the data kept until --purge, the backup folder untouched
        run: |
          set -e
          sudo bash /opt/iris-hub/uninstall.sh
          ! systemctl list-unit-files | grep -q iris-hub || { echo "::error::units left"; exit 1; }
          if [ -e /opt/iris-hub ] || [ -e /etc/default/iris-hub ] || [ ! -d /var/lib/iris-hub ]; then echo "::error::removal left the program or lost the data"; exit 1; fi
          sudo bash out/hub/install.sh
          sudo bash /opt/iris-hub/uninstall.sh --purge
          if [ -e /var/lib/iris-hub ] || id iris-hub 2>/dev/null; then echo "::error::--purge left data or the user"; exit 1; fi
          [ "$(cat /srv/share/IRIS/note.txt)" = "a file of the owner" ] || { echo "::error::removal touched the backup folder"; exit 1; }
          echo "::notice title=Classroom server on Linux::installed, ran as iris-hub on 47620, console keys made and taken away, updater ran, reinstalled with the same keys, removed cleanly"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iris-ucebna-linux
          path: out/hub/
          retention-days: 30

  # F3: learning – loss and gradient as PyTorch computes them, learning from corrections, no harm on FLORES-200 devtest
  # the own OCR learning in C#: exactly what PyTorch computes (loss, every gradient, one AdamW step) on the same lines,
  # the speed of both on the same computer, and a short learning that goes on from the last model of "OCR learning"
  ocr-learning:
    name: OCR learning in C#
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Free fonts (SIL OFL, DejaVu/Bitstream Vera, GUST) – only to draw the test lines
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core fonts-dejavu-extra fonts-liberation2 \
            fonts-noto-core fonts-texgyre fonts-crosextra-carlito fonts-crosextra-caladea fonts-linuxlibertine
      - name: Python tools (PyTorch, Pillow) – only for the reference
        run: |
          bash tools/reference/prepare-opus.sh
          /tmp/venv/bin/pip install -q -r tools/ocr/requirements.txt
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: Reference – one batch of lines through PyTorch (packed like C#)
        run: /tmp/venv/bin/python tools/ocr/reference_training.py /tmp/ocr-reference --threads "$(nproc)"
      - name: The C# learning against PyTorch – loss, gradients, AdamW; speed of both
        run: |
          set -o pipefail
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll check-ocr-training /tmp/ocr-reference --threads "$(nproc)" | tee /tmp/ocr-check.txt
          echo "::notice title=OCR learning in C#::$(grep '^speed' /tmp/ocr-check.txt)"
      - name: Going on from the last model of "OCR learning" – 20 minutes in C#
        run: |
          run=$(gh run list --workflow ocr.yml --status success --limit 20 --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch | endswith("-smoke") | not)][0].databaseId')
          if [ -z "$run" ]; then echo "::notice title=OCR learning in C#::no model of OCR learning yet"; exit 0; fi
          gh run download "$run" -n ocr-model -D /tmp/ocr-model
          /tmp/venv/bin/python tools/ocr/to_training_file.py /tmp/ocr-model/checkpoint.pt /tmp/ocr-start.iris
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll train-ocr /tmp/ocr-cs --start /tmp/ocr-start.iris --minutes 20 --plan 20 \
            --rate 2e-4 --families DejaVu,Liberation,NotoSans-,NotoSerif-,texgyre,Carlito,Caladea,LinLibertine,LinBiolinum \
            --fonts /usr/share/fonts:/usr/share/texmf/fonts/opentype/public/tex-gyre \
            --threads "$(nproc)" --test-lines 300 --test-every 10 | tee /tmp/ocr-cs.txt
          echo "::notice title=OCR learning in C# (from run $run)::$(grep -m1 'CER' /tmp/ocr-cs.txt) → $(tail -1 /tmp/ocr-cs.txt)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ocr-learning-cs
          path: |
            /tmp/ocr-check.txt
            /tmp/ocr-cs/
          retention-days: 14

  learning:
    name: Learning (F3)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: OPUS-MT en-sk – Python tools, download (licence checked) and convert
        run: bash tools/reference/prepare-opus.sh /tmp
      - name: Reference, learning and no harm – gates F3
        run: bash tools/reference/learning.sh /tmp/opus-en-sk /tmp/opus-en-sk.iris eng_Latn slk_Latn
