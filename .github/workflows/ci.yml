name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  core:
    name: Build and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the runner image's .NET 10 SDK, else the Ubuntu package
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: bash tools/ci/dotnet.sh build Iris.slnx -c Release
      - name: Code format (.editorconfig)
        run: bash tools/ci/dotnet.sh format Iris.slnx --verify-no-changes
      - name: Tests
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      # the same tests on the paths of older processors: 128-bit vectors only, then no vector instructions at all
      - name: Tests without AVX2
        env:
          DOTNET_EnableAVX2: '0'
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      - name: Tests without vector instructions
        env:
          DOTNET_EnableHWIntrinsic: '0'
        run: dotnet run --project tests/Iris.Tests -c Release --no-build
      - name: Command line smoke test
        run: dotnet run --project src/Iris.Cli -c Release --no-build -- tokenize tests/Iris.Tests/testdata/tokenizer/nfkc.model "The premiere is tonight."

  # The own core against the reference implementation (Hugging Face transformers + PyTorch, CPU). Python runs only
  # here; IRIS itself has no Python. Heavy, so not on every push of a branch – on pull requests, main and by hand.
  reference:
    name: Reference (transformers)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: Python tools of the reference
        run: bash tools/reference/prepare-opus.sh
      - name: Tiny random model – must match exactly
        run: |
          py=/tmp/venv/bin/python
          $py tools/reference/marian_reference.py tiny /tmp/tiny
          $py tools/reference/marian_reference.py convert /tmp/tiny /tmp/tiny.iris
          $py tools/reference/marian_reference.py reference /tmp/tiny /tmp/tiny.json --set tiny
          bash tools/reference/verify.sh /tmp/tiny.iris /tmp/tiny.json --min-greedy 1 --min-beam 1
      - name: OPUS-MT en-sk – download (licence checked) and convert
        run: |
          bash tools/reference/prepare-opus.sh /tmp
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll info /tmp/opus-en-sk.iris
      - name: OPUS-MT en-sk – reference of 500 invented sentences
        run: /tmp/venv/bin/python tools/reference/marian_reference.py reference /tmp/opus-en-sk /tmp/opus-en-sk.json --set opus --count 500
      - name: OPUS-MT en-sk – gate F1 (greedy ≥ 99 %, beam ≥ 95 %)
        run: bash tools/reference/verify.sh /tmp/opus-en-sk.iris /tmp/opus-en-sk.json --min-greedy 0.99 --min-beam 0.95
      - name: First translations of the own core
        if: always()
        run: |
          [ -f /tmp/opus-en-sk.iris ] || exit 0
          printf '%s\n' "The premiere is tonight." "Critics praised the music but found the ending too slow." \
            "Where is the nearest cinema?" "The second season will have eight episodes." > /tmp/samples.en
          dotnet src/Iris.Cli/bin/Release/net10.0/iris.dll translate /tmp/opus-en-sk.iris < /tmp/samples.en > /tmp/samples.sk
          paste -d '\t' /tmp/samples.en /tmp/samples.sk | while IFS=$'\t' read -r en sk; do echo "::notice title=EN→SK (IRIS)::$en → $sk"; done

  # Windows, where IRIS runs: build, tests, the command line as published for a release, the hardware script
  windows:
    name: Windows (build, tests, publish, hardware script)
    runs-on: windows-2025
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if (-not (dotnet --list-sdks 2>$null | Select-String '^10\.')) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $env:RUNNER_TEMP/dotnet-install.ps1
            & $env:RUNNER_TEMP/dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:ProgramFiles/dotnet"
          }
          dotnet --list-sdks
      - name: Build and tests
        run: |
          dotnet build Iris.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Iris.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Command line as in a release (self-contained, one file)
        run: |
          dotnet publish src/Iris.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/cli
          $size = [math]::Round((Get-Item out/cli/iris.exe).Length / 1MB, 1)
          ./out/cli/iris.exe tokenize tests/Iris.Tests/testdata/tokenizer/nfkc.model "The premiere is tonight."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "::notice title=iris.exe::self-contained single file, $size MB"
      - name: Hardware script (iris-hw.bat)
        run: |
          cmd /c tools\hardware\iris-hw.bat ci-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('ci-runner')) {
            $report = Get-Content "tools/hardware/iris-hw-$name.txt" -Raw | ConvertFrom-Json
            if (-not $report.cpu.name -or -not $report.memory.total_gb -or -not $report.memory.read_gbs_all_threads -or
                $null -eq $report.cpu.features.Fma) {
              "::error::hardware report $name is incomplete"; exit 1
            }
            $text = (Get-Content "tools/hardware/iris-hw-$name.txt" -Raw) -replace '%', '%25' -replace "`r?`n", '%0A'
            "::notice title=hardware $name::$text"
          }

  # Further language pairs (EN→CS, SK→EN, CS→EN) checked as language packs: licence, reference, int8 quality on FLORES
  pairs:
    name: Language pair ${{ matrix.pair }}
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [en-cs, sk-en, cs-en]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: Python tools of the reference
        run: bash tools/reference/prepare-opus.sh
      - name: ${{ matrix.pair }} – download, reference, int8, FLORES-200
        run: bash tools/reference/pair.sh ${{ matrix.pair }}

  # F2: int8, speed (no slower than the base commit; target title + introduction ≤ 1 s) and quality (chrF on FLORES-200 devtest, int8 not worse than float32)
  quality:
    name: Quality and speed (F2)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: dotnet build src/Iris.Cli -c Release
      - name: OPUS-MT en-sk – Python tools (only for converting), download (licence checked) and convert
        run: bash tools/reference/prepare-opus.sh /tmp
      # the speed gate compares with the base commit on the same runner (the pull request's base, or main before the push)
      - name: Base commit for the speed comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then echo "no base commit"; exit 0; fi
          git fetch -q --depth 1 origin "$BASE_SHA"
          git worktree add -q /tmp/base FETCH_HEAD
          dotnet build /tmp/base/src/Iris.Cli -c Release > /dev/null
          echo "BASELINE_IRIS=dotnet /tmp/base/src/Iris.Cli/bin/Release/net10.0/iris.dll" >> "$GITHUB_ENV"
      - name: int8, speed and FLORES-200 quality – gates F2
        run: bash tools/reference/quality.sh /tmp/opus-en-sk.iris
